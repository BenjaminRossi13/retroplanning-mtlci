# Publie le site sur GitHub Pages et régénère le calendrier d'abonnement
# à chaque modification poussée sur la branche main.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer le calendrier (.ics) à partir de data/base.json
        run: python3 tools/build_calendar.py data/base.json calendar/mtlci-2026-27.ics
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html assets data calendar .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
