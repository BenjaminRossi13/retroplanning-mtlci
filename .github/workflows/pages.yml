# Publie le site sur GitHub Pages et régénère le calendrier d'abonnement
# à chaque modification poussée sur la branche main.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer le calendrier (.ics) à partir de data/base.json
        run: python3 tools/build_calendar.py data/base.json calendar/mtlci-2026-27.ics
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html assets data calendar .nojekyll _site/
          # Version unique par publication : force les navigateurs à recharger le code
          sed -i "s#assets/app.css#assets/app.css?v=${GITHUB_SHA::8}#; s#assets/app.js#assets/app.js?v=${GITHUB_SHA::8}#" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
